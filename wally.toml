[package]
name = "this-fifo/audioscape-sdk"
version = "0.17.0"
registry = "https://github.com/UpliftGames/wally-index"
realm = "server"
license = "MIT"
description = "Luau SDK for the AudioScape Developer API — search, browse, and discover music and sound effects, manage playlists, and play audio in Roblox experiences."
authors = ["AudioScape Inc."]

# What ships to consumers via `wally install`. Keeping README + CHANGELOG so
# they show up in the consumer's Packages folder for discovery.
include = ["src", "default.project.json", "LICENSE", "README.md", "CHANGELOG.md"]

# Wally 0.3.2 does NOT enforce `include` as an allowlist — it ships every
# project file unless explicitly excluded. Anything dev-only that would
# otherwise leak into consumer Packages folders gets listed here.
exclude = [
	"tests",
	"tests/**",
	"examples",
	"examples/**",
	".github",
	".github/**",
	".vscode",
	".vscode/**",
	".lune",
	".lune/**",
	"selene",
	"selene/**",
	"rokit.toml",
	"aftman.toml",
	".luaurc",
	".stylua.toml",
	"selene.toml",
	"roblox.yml",
	"globalTypes.d.luau",
	"sourcemap.json",
	"CONTRIBUTING.md",
	".actrc",
	".env.integration",
	".env.integration.example",
	".gitignore",
]

[dependencies]
